<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 640px; }
  body { background: #141413; }
  .hero { width: 1920px; height: 640px; display: flex; align-items: center; justify-content: center; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 200px; letter-spacing: 0.14em; text-indent: 0.14em; background: #141413; color: #FAF9F5; }
  .oring { display: inline-block; width: 0.72em; height: 0.72em; border: 0.08em solid currentColor; border-radius: 50%; margin: 0 0.04em; position: relative; }
  .sdot-in { position: absolute; left: 50%; top: 50%; width: 0.2em; height: 0.2em; margin-left: -0.1em; margin-top: -0.1em; border-radius: 50%; background: #4A6B53; }
</style>
</head>
<body><div class="hero">SYNTR<span class="oring"><span class="sdot-in"></span></span>PY</div></body>
</html>
